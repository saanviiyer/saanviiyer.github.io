---
layout: default
---
<div class="page-header post-header">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%B %Y" }}{% if page.tag %} &middot; {{ page.tag }}{% endif %}</p>
</div>

<article class="post-body">
  {{ content }}
</article>

<p class="post-back"><a href="{{ '/pages/thinking/' | relative_url }}">&larr; all posts</a></p>
