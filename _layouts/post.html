---
layout: default
---
<article class="research-post">
  <header class="rp-head">
    <p class="rp-eyebrow"><a href="{{ '/pages/writing/' | relative_url }}">&larr; writing</a>{% if page.tag %} &middot; {{ page.tag }}{% endif %} &middot; {{ page.date | date: "%b %-d, %Y" }}</p>
    <h1 class="rp-title">{{ page.title }}</h1>
    {% if page.dek %}<p class="rp-dek">{{ page.dek }}</p>{% endif %}
    {% if page.image %}
    <figure class="rp-hero">
      <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">
      {% if page.image_caption %}<figcaption>{{ page.image_caption }}</figcaption>{% endif %}
    </figure>
    {% endif %}
  </header>

  <div class="rp-body">
    {{ content }}
  </div>

  <p class="post-back"><a href="{{ '/pages/writing/' | relative_url }}">&larr; all writing</a></p>
</article>

{% if page.math %}
<script>
  window.MathJax = { tex: { displayMath: [['$$', '$$'], ['\\[', '\\]']], inlineMath: [['\\(', '\\)']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
{% endif %}
