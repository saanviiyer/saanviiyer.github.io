<div class="footer-deco">
  <svg class="footer-deco-moon" viewBox="0 0 420 420" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="moonrough" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="24"/>
      </filter>
      <radialGradient id="moongrad" cx="42%" cy="42%" r="66%">
        <stop offset="0%" stop-color="#DBD4E9"/>
        <stop offset="64%" stop-color="#C4BDD9"/>
        <stop offset="100%" stop-color="#ADA6C6"/>
      </radialGradient>
    </defs>
    <circle cx="210" cy="210" r="160" fill="url(#moongrad)" filter="url(#moonrough)"/>
  </svg>

  <svg class="footer-deco-flora" viewBox="0 0 300 340" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#C2948A" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M150 340 C150 282 140 232 152 176"/>
      <path d="M152 208 C186 200 206 160 206 118"/>
      <path d="M150 236 C120 226 104 206 96 178"/>
      <path d="M152 262 C188 252 216 240 236 208"/>
    </g>

    <g fill="#8FA9B8" opacity="0.75">
      <path d="M150 206 C131 199 118 206 114 221 C131 226 144 219 150 206 Z"/>
      <path d="M150 252 C169 245 183 251 187 266 C169 270 157 263 150 252 Z"/>
      <path d="M186 150 C200 138 214 140 220 152 C207 160 194 158 186 150 Z"/>
    </g>

    <!-- jasmine sprigs -->
    <g fill="#F3EDE7">
      <g transform="translate(236,206)"><ellipse cy="-7" rx="4" ry="7.5"/><ellipse cy="-7" rx="4" ry="7.5" transform="rotate(72)"/><ellipse cy="-7" rx="4" ry="7.5" transform="rotate(144)"/><ellipse cy="-7" rx="4" ry="7.5" transform="rotate(216)"/><ellipse cy="-7" rx="4" ry="7.5" transform="rotate(288)"/></g>
      <g transform="translate(252,224)"><ellipse cy="-6" rx="3.4" ry="6.4"/><ellipse cy="-6" rx="3.4" ry="6.4" transform="rotate(72)"/><ellipse cy="-6" rx="3.4" ry="6.4" transform="rotate(144)"/><ellipse cy="-6" rx="3.4" ry="6.4" transform="rotate(216)"/><ellipse cy="-6" rx="3.4" ry="6.4" transform="rotate(288)"/></g>

    </g>
    <g fill="#EAD9A2">
      <circle cx="236" cy="206" r="2.6"/><circle cx="252" cy="224" r="2.2"/><circle cx="224" cy="232" r="2.2"/>
    </g>

    <!-- hibiscus 1 -->
    <g transform="translate(206,116)">
      <g fill="#EED7E0">
        <ellipse cy="-20" rx="12" ry="23"/>
        <ellipse cy="-20" rx="12" ry="23" transform="rotate(72)"/>
        <ellipse cy="-20" rx="12" ry="23" transform="rotate(144)"/>
        <ellipse cy="-20" rx="12" ry="23" transform="rotate(216)"/>
        <ellipse cy="-20" rx="12" ry="23" transform="rotate(288)"/>
      </g>
      <circle r="7.5" fill="#D98BB5"/>
      <circle r="3.6" fill="#B30089"/>
      <line x1="0" y1="0" x2="11" y2="17" stroke="#C2948A" stroke-width="2"/>
      <circle cx="11" cy="17" r="2.8" fill="#EAD9A2"/>

      <circle r="6" fill="#D98BB5"/>

      <line x1="0" y1="0" x2="-9" y2="14" stroke="#C2948A" stroke-width="2"/>
