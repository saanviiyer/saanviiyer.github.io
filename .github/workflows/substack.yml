name: Sync Substack posts

# Pulls the latest posts from the Substack RSS feed into _data/substack.json so the
# non-technical writing section updates itself. Runs on a schedule and can be run by
# hand from the Actions tab. When it commits a change, the Pages build redeploys.

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (GitHub may delay scheduled runs)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: substack-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feed
        run: python3 scripts/fetch_substack.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain _data/substack.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/substack.json
            git commit -m "Sync Substack posts"
            git push
          else
            echo "No change."
          fi
