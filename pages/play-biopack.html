<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-screen workbench. Header, sequence strip, viewer + side panel, command console. */
:root {
  --bg: #e9edf0;
  --panel: #f7f9fa;
  --raise: #ffffff;
  --ink: #17212b;
  --muted: #5a6875;
  --line: #cfd7de;
  --accent: #1f8a4c;
  --accent-ink: #ffffff;
  --sele: #d42fb6;
  --warn: #b25a00;
  --warn-bg: #fff2e2;
  --info-bg: #e8f2ec;
  --err: #c0362c;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1418; --panel: #151c22; --raise: #1b242b; --ink: #e2e9ee; --muted: #93a2ae;
    --line: #2a3640; --accent: #4cc581; --accent-ink: #08130c; --sele: #ff5fdc;
    --warn: #f0a25a; --warn-bg: #2b2116; --info-bg: #14251c; --err: #ff7a6e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #151c22; --raise: #1b242b; --ink: #e2e9ee; --muted: #93a2ae;
  --line: #2a3640; --accent: #4cc581; --accent-ink: #08130c; --sele: #ff5fdc;
  --warn: #f0a25a; --warn-bg: #2b2116; --info-bg: #14251c; --err: #ff7a6e; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, .r:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 8px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; margin-right: 4px; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl label { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
select, .btn { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font-size: 13px; cursor: pointer; }
.btn:hover, select:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--raise); }
.seg button { border: 0; background: transparent; padding: 5px 9px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.spacer { flex: 1; }

.seq { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; overflow-y: hidden; padding: 4px 8px 6px; white-space: nowrap; font-family: var(--mono); font-size: 12.5px; line-height: 1; min-height: 38px; }
.seq .obj { display: inline-flex; align-items: flex-end; gap: 0; margin-right: 18px; }
.seq .tag { font-size: 10.5px; color: var(--muted); padding: 0 6px 2px 0; align-self: flex-end; }
.seq .tag b { color: var(--ink); font-weight: 600; }
.seq .r { display: inline-flex; flex-direction: column; align-items: center; width: 10px; cursor: pointer; border-radius: 2px; user-select: none; }
.seq .r i { font-style: normal; font-size: 9px; color: var(--muted); height: 12px; line-height: 12px; overflow: visible; white-space: nowrap; }
.seq .r span { height: 16px; line-height: 16px; width: 10px; text-align: center; border-radius: 2px; }
.seq .r:hover span { background: var(--line); }
.seq .r.on span { background: var(--sele); color: #fff; }
.seq .het { display: inline-block; font-size: 11px; padding: 2px 4px; margin-left: 4px; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; align-self: flex-end; }
.seq .het.on { background: var(--sele); color: #fff; border-color: var(--sele); }
.seq .empty { color: var(--muted); font-family: var(--sans); font-size: 13px; line-height: 28px; }

.work { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 8px; min-height: 0; }
.stage { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); min-height: 280px; background: #000; }
#viewer { position: absolute; inset: 0; }
.hud { position: absolute; left: 8px; bottom: 8px; right: 8px; pointer-events: none; display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 11.5px; }
.hud span { background: rgba(10, 14, 18, 0.72); color: #e8eef2; padding: 3px 7px; border-radius: 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud span:empty { display: none; }
.dropzone { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(31, 138, 76, 0.28); color: #fff; font-weight: 600; font-size: 18px; border: 3px dashed #fff; border-radius: 8px; pointer-events: none; }

.side { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.side section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.side section:last-child { border-bottom: 0; }
.side h2 { font-size: 10.5px; font-family: var(--mono); font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
.side h2 button { font-family: var(--mono); font-size: 10.5px; text-transform: none; letter-spacing: 0; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }

.rows { display: flex; flex-direction: column; gap: 2px; }
.row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 5px; }
.row:hover { background: var(--raise); }
.row input[type="checkbox"] { margin: 0; accent-color: var(--accent); }
.row .nm { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm small { color: var(--muted); font-size: 11px; margin-left: 4px; }
.row .nm.sel { color: var(--sele); }
.row .nm.dist { color: var(--warn); }
.ash { display: inline-flex; gap: 2px; }
.ash button { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line); background: var(--raise); font-family: var(--mono); font-size: 11px; font-weight: 600; cursor: pointer; padding: 0; }
.ash button:hover { border-color: var(--accent); color: var(--accent); }
.rows .none { color: var(--muted); font-size: 12.5px; padding: 2px 4px; }
.subhead { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 8px 0 2px 4px; }

.menu { position: fixed; z-index: 30; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.22); padding: 6px; min-width: 184px; max-width: min(300px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto; }
.menu .mh { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 4px 8px 2px; }
.menu button.mi { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 5px 8px; border-radius: 5px; font-size: 13px; cursor: pointer; }
.menu button.mi:hover { background: var(--bg); }
.menu .sw { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 4px 8px 6px; }
.menu .sw button { aspect-ratio: 1; max-width: 100%; border-radius: 4px; border: 1px solid rgba(127,127,127,0.4); cursor: pointer; padding: 0; }

.insp .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.insp .head b { font-family: var(--mono); font-size: 16px; }
.insp .head span { color: var(--muted); font-size: 12.5px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; margin: 8px 0; font-size: 12.5px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); background: var(--raise); border-radius: 4px; padding: 1px 5px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.mut { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.mut .pick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; }
.mut table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mut th, .mut td { text-align: right; padding: 3px 4px; border-bottom: 1px solid var(--line); }
.mut th:first-child, .mut td:first-child { text-align: left; color: var(--muted); font-weight: 400; }
.mut th { font-family: var(--mono); font-size: 11px; font-weight: 600; }
.flags { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.flags li { font-size: 12.5px; line-height: 1.4; padding: 5px 8px; border-radius: 5px; border-left: 3px solid; }
.flags li.warn { background: var(--warn-bg); border-color: var(--warn); }
.flags li.info { background: var(--info-bg); border-color: var(--accent); }
.note { font-size: 11.5px; color: var(--muted); line-height: 1.45; margin: 8px 0 0; }
.muted { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: 0; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.acts .btn { font-size: 12px; padding: 4px 8px; }

.tips { display: flex; flex-direction: column; gap: 3px; }
.tips button { text-align: left; background: none; border: 0; padding: 2px 0; cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--ink); }
.tips button:hover { color: var(--accent); }
.tips button em { font-style: normal; color: var(--muted); font-family: var(--sans); font-size: 11.5px; margin-left: 6px; }

.console { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-width: 0; }
#log { height: 104px; overflow-y: auto; padding: 6px 10px; font-family: var(--mono); font-size: 12px; line-height: 1.5; }
#log div { white-space: pre-wrap; word-break: break-word; }
#log .cmd { color: var(--accent); }
#log .cmd::before { content: "cmd › "; color: var(--muted); }
#log .err { color: var(--err); }
#log .dim { color: var(--muted); }
#log a { color: var(--accent); }
.prompt { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 6px 10px; }
.prompt label { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.prompt input { flex: 1; min-width: 0; border: 0; background: transparent; font-family: var(--mono); font-size: 13px; outline: none; }

.modal { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.55); display: grid; place-items: center; padding: 16px; }
.modal .box { background: var(--raise); border-radius: 10px; padding: 12px; max-width: min(900px, 100%); display: flex; flex-direction: column; gap: 8px; }
.modal img { max-width: 100%; max-height: 70vh; border-radius: 6px; }
.modal .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }

@media (max-width: 880px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-rows: auto; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 58vh; min-height: 300px; }
  .side { overflow: visible; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.back { font-family: var(--mono); font-size: 12px; color: var(--accent); text-decoration: none; }
.back:hover { text-decoration: underline; }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <a class="back" href="/playground/">&larr; playground</a><div class="brand">BioPack <small>protein viewer with PyMOL-style commands</small></div>
    <div class="ctl">
      <label for="ex">Structure</label>
      <select id="ex"></select>
    </div>
    <button class="btn" id="open" type="button">Open file…</button>
    <input id="file" type="file" accept=".pdb,.ent,.cif,.mmcif,.sdf,.mol,.mol2,.xyz,.pqr" multiple hidden>
    <div class="ctl">
      <label>Click picks</label>
      <div class="seg" id="mode" role="group" aria-label="Click picks">
        <button type="button" data-m="residue" aria-pressed="true">Residue</button>
        <button type="button" data-m="atom" aria-pressed="false">Atom</button>
        <button type="button" data-m="chain" aria-pressed="false">Chain</button>
        <button type="button" data-m="measure" aria-pressed="false">Measure</button>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="spin" type="button" aria-pressed="false">Spin</button>
    <button class="btn" id="reset" type="button">Reset view</button>
    <button class="btn" id="snap" type="button">Image</button>
  </header>

  <div class="seq" id="seq" aria-label="Sequence"></div>

  <main class="work">
    <div class="stage" id="stage">
      <div id="viewer"></div>
      <div class="hud"><span id="hover"></span><span id="status"></span></div>
      <div class="dropzone" id="drop" hidden>Drop a structure file to load it</div>
    </div>
    <aside class="side">
      <section>
        <h2>Objects &amp; selections <button type="button" id="clearsel">Clear selection</button></h2>
        <div class="rows" id="objs"></div>
      </section>
      <section class="insp">
        <h2>Residue inspector</h2>
        <div id="insp"></div>
      </section>
      <section>
        <h2>Try a command</h2>
        <div class="tips" id="tips"></div>
      </section>
    </aside>
  </main>

  <section class="console">
    <div id="log" aria-live="polite"></div>
    <form class="prompt" id="cmdform" autocomplete="off">
      <label for="cmd">cmd ›</label>
      <input id="cmd" spellcheck="false" placeholder="show sticks, organic   ·   type help for all commands">
    </form>
  </section>
</div>

  h += `<div class="muted" style="margin-bottom:4px">Within 4 Å (${env.contacts.length})</div><div class="chips">${env.contacts.map(c => `<button type="button" class="chip" data-res="${c.idx}">${esc(c.resn)}${c.resi}${c.chain && c.chain !== r.chain ? '/' + esc(c.chain) : ''}</button>`).join('') || '<span class="muted">none</span>'}</div>`;
  h += `<div class="acts"><button type="button" class="btn" data-act="env">Show environment</button><button type="button" class="btn" data-act="zoom">Zoom</button></div>`;
  if (one && VOL[one]) {
    const opts = Object.keys(ONE2THREE).filter(x => x !== one).map(x => `<option value="${x}" ${x === mutTo ? 'selected' : ''}>${ONE2THREE[x]} (${x})</option>`).join('');
    if (mutTo === one) mutTo = one === 'A' ? 'G' : 'A';
    const to = mutTo;
    const row = (lab, a, b, f) => `<tr><td>${lab}</td><td>${f(a)}</td><td>${f(b)}</td><td>${typeof a === 'number' ? ((b - a) >= 0 ? '+' : '') + f(b - a) : ''}</td></tr>`;
    h += `<div class="mut"><div class="pick"><label for="mutto">Substitute ${esc(r.resn)}${r.resi} with</label><select id="mutto">${opts}</select></div>`;
    h += `<table><thead><tr><th></th><th>${one}</th><th>${to}</th><th>change</th></tr></thead><tbody>`;
    h += row('Side-chain volume (Å³)', VOL[one], VOL[to], v => v.toFixed(0));
    h += row('Hydropathy (Kyte–Doolittle)', KD[one], KD[to], v => v.toFixed(1));
    h += row('Charge at pH 7', CHG[one] || 0, CHG[to] || 0, v => (v > 0 ? '+' : '') + v);

function mutFlags(from, to, c) {
  const f = []; const dv = VOL[to] - VOL[from]; const buried = c.rel != null && c.rel < 0.2;
  if (buried && dv > 25) f.push(['warn', `Larger side chain (+${dv.toFixed(0)} Å³) at a buried position. It may not fit without moving its neighbours.`]);
  if (buried && dv < -40) f.push(['warn', `Smaller side chain (${dv.toFixed(0)} Å³) at a buried position. This can leave a cavity in the core.`]);
  if (buried && (CHG[to] || 0) !== 0 && !(CHG[from] || 0)) f.push(['warn', 'Puts a charged side chain into the buried core.']);
  if (c.salt.length && (CHG[to] || 0) !== (CHG[from] || 0)) f.push(['warn', `Changes the charge that pairs with ${c.salt.join(', ')} in a salt bridge.`]);
  if (c.scPolar.length && !POLAR_SC.has(to)) f.push(['warn', `Removes side-chain hydrogen bonds to ${[...new Set(c.scPolar.map(p => p.b.__res.resn + p.b.__res.resi))].join(', ')}.`]);
  if (c.ssbond && from === 'C') f.push(['warn', `Breaks the disulfide bond with ${c.ssbond}.`]);
  if (to === 'P' && (c.ss === 'helix' || c.ss === 'strand')) f.push(['warn', `Proline inside a ${c.ss} usually disrupts it. Proline has no backbone N–H to donate a hydrogen bond.`]);
  if (from === 'G' && c.phi != null && c.phi > 0) f.push(['warn', `This glycine has a positive φ angle (${c.phi.toFixed(0)}°). Most other residues disfavour that backbone shape.`]);
  if (from === 'P') f.push(['info', 'Replacing proline makes the backbone more flexible here.']);
  if (to === 'G') f.push(['info', 'Glycine makes the backbone more flexible here.']);
  if (!f.length) f.push(['info', c.rel != null && c.rel >= 0.5 ? 'Exposed position with no contacts flagged by these checks.' : 'No flags from these checks.']);
  return f;
}
$('#insp').addEventListener('change', e => { if (e.target.id === 'mutto') { mutTo = e.target.value; renderInspector(); } });
$('#insp').addEventListener('click', e => {
  const c = e.target.closest('[data-res]'); if (c) { focusRes = residues[+c.dataset.res]; run(`inspect ${resSelStr(focusRes)}`); return; }
  const b = e.target.closest('[data-act]'); if (!b || !focusRes) return;
  const s = resSelStr(focusRes);
  if (b.dataset.act === 'zoom') run(`zoom ${s}, 6`);
  else run(`select focus, ${s}; select env, byres (focus around 5) and not solvent and not focus; show sticks, (focus or env) and not hydrogens; polar focus; zoom focus, 7`);
});

/* ---------- commands ---------- */
const REP = { cartoon: 'cartoon', cartoons: 'cartoon', ribbon: 'cartoon', sticks: 'sticks', stick: 'sticks', licorice: 'sticks', lines: 'lines', line: 'lines', wire: 'lines', spheres: 'spheres', sphere: 'spheres', nb_spheres: 'spheres', surface: 'surface', surf: 'surface', labels: 'labels', label: 'labels', everything: 'everything', all: 'everything' };

function selArg(s) { return evalSel(s || 'all'); }
function report(name, m) { out(` Selector: selection "${name}" defined with ${count(m)} atoms.`, 'dim'); }

const HELP = [
  ['fetch id', 'load a bundled example: ' + EXAMPLES.map(e => e.id).join(', ')],
  ['load', 'open a .pdb, .cif, .sdf, .mol2 or .xyz file (or drop one on the viewer)'],
  ['show rep, sel', 'rep: cartoon, sticks, lines, spheres, surface, labels'],
  ['hide rep, sel', 'hide everything, sel clears all representations'],
  ['as rep, sel', 'show only this representation'],
  ['color name, sel', 'PyMOL colour names, #hex, atomic (by element)'],
  ['util.cbc sel', 'colour by chain'],
  ['spectrum expr, palette, sel', 'expr: count, b, plddt, hydropathy, ss. palette: rainbow, blue_red, blue_white_red'],
  ['select name, sel', 'chain A, resi 10-20, resn HEM, name CA, elem Fe, ss H, b > 70, organic, solvent, polymer, sidechain, byres, around, within D of'],
  ['zoom / orient / center sel', 'move the camera'],
  ['label sel, expr', 'expr like resn+resi, name, chain, b'],
  ['distance [name,] sel1, sel2[, cutoff]', 'dashed distances'],
  ['polar sel', 'polar contacts (N/O within 3.5 Å) from sel to everything else'],
  ['inspect sel', 'open the residue inspector on the first residue'],
  ['set name, value', 'stick_radius, sphere_scale, cartoon_transparency, transparency, label_size'],
  ['bg_color colour', 'viewer background'],
  ['remove sel / delete name', 'remove atoms / delete an object, selection or measurement'],
  ['fasta sel', 'print the sequence'],
  ['count_atoms sel', 'count atoms'],
  ['spin / turn axis, angle / png / reinitialize', ''],
];
const CMDS = {
  help() { out(' Commands (arguments separated by commas, several commands joined with ";"):', 'dim'); for (const [c, d] of HELP) out(`  ${c.padEnd(34)} ${d}`, 'dim'); },
  fetch(a) {
    const id = (a[0] || '').trim(); if (!id) throw Error('Usage: fetch 1ubq');
    if (loadExample(id)) return;
    const up = id.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (up.length !== 4) throw Error('PDB IDs have four characters, like 1ubq.');
    fetchPdb(up);
  },
  load() { $('#file').click(); },
  show(a) { const rep = normRep(a[0] || 'lines'); const m = selArg(a[1]); if (rep === 'labels') return CMDS.label([a[1] || 'all']); if (rep === 'everything') throw Error('Pick one representation to show.'); for (const x of pick(m)) x.__reps.add(rep); refresh(); },
  hide(a) {
    const rep = a[0] ? normRep(a[0]) : 'everything'; const m = selArg(a[1]);
    for (const x of pick(m)) { if (rep === 'everything') { x.__reps.clear(); x.__label = null; } else if (rep === 'labels') x.__label = null; else x.__reps.delete(rep); }
    refresh();
  },
  as(a) { const rep = normRep(a[0]); const m = selArg(a[1]); for (const x of pick(m)) { x.__reps.clear(); if (rep !== 'labels' && rep !== 'everything') x.__reps.add(rep); } refresh(); },
  color(a) {
    const name = (a[0] || '').trim(); const m = selArg(a[1]); const L = pick(m);
    const n = name.toLowerCase();
    if (['atomic', 'elem', 'element', 'cnc'].includes(n)) colorByElement(L);
    else if (n === 'cpk') colorByElement(L, false);
    else if (['chain', 'bychain', 'chains'].includes(n)) colorByChain(L);
    else { const hx = parseColor(name); if (!hx) throw Error(`Unknown colour "${name}". Try red, slate, wheat, or #ff8800.`); colorAtoms(L, hx); }
    refresh();
  },
  'util.cbc'(a) { colorByChain(pick(selArg(a[0]))); refresh(); },
  'util.cnc'(a) { colorByElement(pick(selArg(a[0]))); refresh(); },
  spectrum(a) {
    const expr = (a[0] || 'count').trim().toLowerCase() || 'count';
    const pal = PALETTES[(a[1] || '').trim().toLowerCase() || (expr === 'b' ? 'blue_red' : expr === 'hydropathy' ? 'blue_white_red' : 'rainbow')];
    if (!pal) throw Error('Unknown palette. Use rainbow, blue_red, blue_white_red, red_white_blue, green_red, or blue_green.');
    const L = pick(selArg(a[2]));
    if (expr === 'count') {
      const groups = new Map();
      for (const x of L) { const k = x.__obj.name + '|' + x.chain; (groups.get(k) || groups.set(k, []).get(k)).push(x); }
      for (const g of groups.values()) { const rs = [...new Set(g.map(x => x.__res))].sort((p, q) => p.idx - q.idx); const n = Math.max(1, rs.length - 1); const pos = new Map(rs.map((r, i) => [r, i / n])); for (const x of g) x.__col = pal(pos.get(x.__res)); }
    } else if (expr === 'b') {
      const bs = L.map(x => +x.b); const lo = Math.min(...bs), hi = Math.max(...bs), span = hi - lo || 1;
      for (const x of L) x.__col = pal((x.b - lo) / span);
      out(` Spectrum: b from ${lo.toFixed(1)} (start) to ${hi.toFixed(1)} (end).`, 'dim');
    } else if (expr === 'plddt') {
      for (const x of L) x.__col = x.b > 90 ? '#0053d6' : x.b > 70 ? '#65cbf3' : x.b > 50 ? '#ffdb13' : '#ff7d45';
      out(' pLDDT: >90 dark blue, 70–90 light blue, 50–70 yellow, <50 orange. Meaningful only for predicted models that store pLDDT in the B column.', 'dim');
    } else if (expr === 'hydropathy') {
      for (const x of L) { const k = KD[AA3[x.__res.resn]]; if (k != null) x.__col = pal((k + 4.5) / 9); }
      out(' Hydropathy (Kyte–Doolittle): hydrophilic at the start of the palette, hydrophobic at the end.', 'dim');
    } else if (expr === 'ss') {
      for (const x of L) if (x.__kind === 'protein') x.__col = x.ss === 'h' ? '#ff0000' : x.ss === 's' ? '#ffff00' : '#33ff33';
    } else throw Error('spectrum takes count, b, plddt, hydropathy, or ss.');
    refresh();
  },
  select(a) {
    let name = 'sele', s = a[0];
    if (a.length >= 2) { name = a[0].trim(); s = a.slice(1).join(','); }
    if (!/^[A-Za-z_][\w-]*$/.test(name)) throw Error('Selection names use letters, digits, _ or -.');
    if (findObj(name)) throw Error(`"${name}" is already an object name.`);
    const m = evalSel(s); sels.set(name, m); report(name, m); refresh();
  },
  deselect() { sels.delete('sele'); refresh(); },
  zoom(a) {
    let m = selArg(a[0]); if (!count(m)) throw Error('Nothing matches that selection.');
    const buf = parseFloat(a[1]); if (buf > 0) m = around(m, buf, true);
    const set = new Set(pick(m)); viewer.zoomTo({ predicate: x => set.has(x) }, 500); viewer.render();
  },
  orient(a) { CMDS.zoom(a); },
  center(a) { const m = selArg(a[0]); const set = new Set(pick(m)); viewer.center({ predicate: x => set.has(x) }, 400); },
  reset() { viewer.zoomTo({}, 400); },
  bg_color(a) { const hx = parseColor(a[0] || 'black'); if (!hx) throw Error('Unknown colour.'); bgColor = hx; viewer.setBackgroundColor(hx); $('#stage').style.background = hx; render(); },
  label(a) {

    const get = (x, p) => ({ resn: x.__res.resn, resi: x.resi, name: x.atom, chain: x.chain, b: (+x.b).toFixed(1), elem: el(x), q: x.occupancy ?? 1 }[p] ?? p.replace(/^["']|["']$/g, ''));

  },
  distance(a) {
    let name, s1, s2, cut = 4.0;
    if (a.length === 2) [s1, s2] = a; else if (a.length === 3) { if (isNaN(parseFloat(a[2]))) [name, s1, s2] = a; else { [s1, s2] = a; cut = +a[2]; } } else if (a.length >= 4) { [name, s1, s2] = a; cut = +a[3]; } else throw Error('Usage: distance name, sel1, sel2[, cutoff]');

      if (BB.has(x.atom) && BB.has(y.atom) && x.chain === y.chain && Math.abs(x.resi - y.resi) <= 1) continue;
      pairs.push([x, y]);
    }
    const name = (a[1] || 'polar_' + String(++distCount).padStart(2, '0')).trim();
    measures.push({ name, pairs, color: '#ffd23f', showLen: false, enabled: true });
    out(` ${name}: ${pairs.length} polar contacts (N/O within 3.5 Å).`, 'dim'); refresh();
  },
  inspect(a) { const L = pick(selArg(a[0])); if (!L.length) throw Error('Nothing matches that selection.'); focusRes = L[0].__res; renderInspector(); },
  set(a) {
    const k = (a[0] || '').trim().toLowerCase(); const v = parseFloat(a[1]);
    if (!(k in settings)) throw Error(`Unknown setting. Use ${Object.keys(settings).join(', ')}.`);
    if (isNaN(v)) throw Error('Give a number.');
    settings[k] = v; if (k === 'transparency') surfKey = ''; refresh();
  },
  enable(a) { const o = findObj(a[0] || ''); if (!o) throw Error('No object with that name.'); o.enabled = true; o.model.show(); refresh(); },
  disable(a) { const o = findObj(a[0] || ''); if (!o) throw Error('No object with that name.'); o.enabled = false; o.model.hide(); refresh(); },
  delete(a) {
    const n = (a[0] || '').trim();
    if (n === 'all') { CMDS.reinitialize(); return; }
    const o = findObj(n);
    if (o) { viewer.removeModel(o.model); objects.splice(objects.indexOf(o), 1); surfKey = ''; rebuildAtoms(); renderSeq(); refresh(); return; }
    if (sels.has(n)) { sels.delete(n); refresh(); return; }
    const i = measures.findIndex(m => m.name === n); if (i >= 0) { measures.splice(i, 1); refresh(); return; }

  remove(a) {
    const m = selArg(a[0]); const L = pick(m); if (!L.length) { out(' Nothing to remove.', 'dim'); return; }

  },
  reinitialize() { viewer.clear(); objects.length = 0; sels.clear(); measures.length = 0; surfKey = ''; focusRes = null; rebuildAtoms(); renderSeq(); refresh(); },
  fasta(a) {
    const m = selArg(a[0]); const by = new Map();
    for (const r of residues) if ((r.kind === 'protein' || r.kind === 'nucleic') && r.atoms.some(x => m[x.__g])) { const k = r.obj.name + '_' + (r.chain || ''); by.set(k, (by.get(k) || '') + ((r.kind === 'protein' ? AA3[r.resn] : NUC[r.resn]) || 'X')); }
    if (!by.size) { out(' No polymer residues in that selection.', 'dim'); return; }
    for (const [k, s] of by) { out(`>${k}`); for (let i = 0; i < s.length; i += 60) out(s.slice(i, i + 60)); }

  count_atoms(a) { out(` count_atoms: ${count(selArg(a[0]))} atoms`, 'dim'); },
  spin(a) { const on = !a[0] || !/^(off|0|false)$/i.test(a[0]); viewer.spin(on ? 'y' : false, 0.6); $('#spin').setAttribute('aria-pressed', on); },
  turn(a) { const ax = (a[0] || 'y').trim().toLowerCase(); const ang = parseFloat(a[1] || '90'); viewer.rotate(ang, ax); },
  png() { snap(); },
  ray() { snap(); },
};
CMDS.cls = () => { $('#log').innerHTML = ''; };
CMDS.mutate = () => out(' Pick a residue, then use "Substitute with" in the residue inspector to compare amino acids at that position.', 'dim');

function run(line, echo = true) {
  line = (line || '').trim(); if (!line) return;
  if (echo) out(line, 'cmd');
  for (const part of line.split(';')) {
    const p = part.trim(); if (!p) continue;
    const m = p.match(/^([A-Za-z_][\w.]*)\s*(.*)$/);
    try {
      if (!m) throw Error(`Could not read "${p}".`);
      const fn = CMDS[m[1].toLowerCase()];
      if (!fn) throw Error(`Unknown command "${m[1]}". Type help for the list.`);
      if (!viewer && m[1].toLowerCase() !== 'help') throw Error('The 3D viewer did not start.');
      const args = m[2] ? m[2].split(',').map(s => s.trim()) : [];
      fn(args, m[2]);
    } catch (e) { out(' Error: ' + e.message, 'err'); break; }
  }
}

/* ---------- image ---------- */
function snap() {
  const uri = viewer.pngURI();
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="box"><img alt="Snapshot of the current view" src="${uri}"><div class="bar"><span>Right-click or long-press the image to save it.</span><button type="button" class="btn">Close</button></div></div>`;
  d.addEventListener('click', e => { if (e.target === d || e.target.closest('button')) d.remove(); });
  document.body.appendChild(d);
}

/* ---------- wiring ---------- */
const hist = []; let hi = 0;
$('#cmdform').addEventListener('submit', e => { e.preventDefault(); const v = $('#cmd').value; if (v.trim()) { hist.push(v); hi = hist.length; } $('#cmd').value = ''; run(v); });
$('#cmd').addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' && hi > 0) { hi--; $('#cmd').value = hist[hi]; e.preventDefault(); }
  else if (e.key === 'ArrowDown') { hi = Math.min(hist.length, hi + 1); $('#cmd').value = hist[hi] || ''; e.preventDefault(); }
});
$('#ex').innerHTML = EXAMPLES.map(e => `<option value="${e.id}">${e.id} · ${esc(e.short)}</option>`).join('');
$('#ex').addEventListener('change', e => run(`fetch ${e.target.value}`));
$('#open').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { loadFiles(e.target.files); e.target.value = ''; });
$('#mode').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; clickMode = b.dataset.m; measurePick = [];
  $('#mode').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  status(clickMode === 'measure' ? 'Click two atoms to measure the distance.' : `Clicks select by ${clickMode}.`); render();
});
$('#spin').addEventListener('click', () => run($('#spin').getAttribute('aria-pressed') === 'true' ? 'spin off' : 'spin'));
$('#reset').addEventListener('click', () => run('reset'));
$('#snap').addEventListener('click', () => run('png'));
$('#clearsel').addEventListener('click', () => run('deselect'));
const TIPS = [
  ['util.cbc', 'colour by chain'], ['show sticks, organic', 'ligands'], ['spectrum count', 'rainbow N to C'],
  ['select pocket, byres (organic around 5) and polymer', ''], ['show sticks, pocket and not hydrogens', ''], ['polar organic', 'H-bonds to ligands'],
  ['show surface, chain A', ''], ['set transparency, 0.4', ''], ['hide surface', ''], ['spectrum b', 'B-factor'], ['bg_color white', ''], ['fasta', 'sequence'],
];
$('#tips').innerHTML = TIPS.map(([c, d]) => `<button type="button" data-cmd="${esc(c)}">${esc(c)}${d ? `<em>${esc(d)}</em>` : ''}</button>`).join('');
$('#tips').addEventListener('click', e => { const b = e.target.closest('[data-cmd]'); if (b) run(b.dataset.cmd); });

const stage = $('#stage'); let dragDepth = 0;
stage.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('#drop').hidden = false; });
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
stage.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#drop').hidden = true; loadFiles(e.dataTransfer.files); });
document.addEventListener('paste', e => {
  const t = e.clipboardData && e.clipboardData.getData('text'); if (!t || t.length < 200 || !/^(ATOM  |HETATM)/m.test(t)) return;
  e.preventDefault(); try { loadText(t, 'pdb', 'pasted'); } catch (err) { out(err.message, 'err'); }
});

/* ---------- start ---------- */
function start() {
  renderPanel(); renderSeq(); renderInspector();
  if (typeof $3Dmol === 'undefined') { out('The 3D library did not load, so the viewer cannot start. Check your connection and reload.', 'err'); return; }
  viewer = $3Dmol.createViewer($('#viewer'), { backgroundColor: bgColor, antialias: true });
  viewer.setHoverDuration(60);
  new ResizeObserver(() => { viewer.resize(); viewer.render(); }).observe($('#stage'));
  out('BioPack. Drop a .pdb or .cif file on the viewer, pick an example above, or type help.', 'dim');
  run('fetch 4HHB');
  run('util.cbc');
  const his = residues.find(r => r.resn === 'HIS' && r.resi === 87 && r.chain === 'A');

}
start();
