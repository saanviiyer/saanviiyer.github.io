<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace }}" />
  <title>{{ page.title | default: site.title }}</title>

  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace }}" />
  {% unless page.layout == 'post' %}<meta property="og:image" content="{{ '/assets/img/og.png' | absolute_url }}" />{% endunless %}
  <meta name="twitter:card" content="{% if page.layout == 'post' %}summary{% else %}summary_large_image{% endif %}" />
  <meta name="twitter:title" content="{{ page.title | default: site.title }}" />
  <meta name="twitter:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace }}" />
  {% unless page.layout == 'post' %}<meta name="twitter:image" content="{{ '/assets/img/og.png' | absolute_url }}" />{% endunless %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=20261017" />

  <script>
    // Set theme before paint to avoid a flash.
    (function () {
      try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    })();
  </script>
</head>
<body>

  <canvas id="neural-bg" aria-hidden="true"></canvas>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>

  {% include nav.html %}

  <main>
    <div class="page-content{% if page.home %} page-content-home{% endif %}">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}
  <script src="{{ '/assets/js/neural.js' | relative_url }}"></script>
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        window.dispatchEvent(new Event('themechange'));
      });
    })();
  </script>
  <script>
    // Flashcard flip: click or Enter/Space on a .flip-card toggles it. The
    // container height animates to the visible face so the front stays compact.
    (function () {
      function flip(card) {
        card.classList.toggle('flipped');
        var inner = card.querySelector('.flip-inner');
        var back = card.querySelector('.flip-back');
        if (!inner || !back) return;
        inner.style.height = card.classList.contains('flipped') ? back.offsetHeight + 'px' : '';
      }
      document.addEventListener('click', function (e) {
        if (e.target.closest('a')) return;
        var card = e.target.closest('.flip-card');
        if (card) flip(card);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        var card = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.flip-card') : null;
        if (card) { e.preventDefault(); flip(card); }
      });
      window.addEventListener('resize', function () {
        document.querySelectorAll('.flip-card.flipped').forEach(function (card) {
          var inner = card.querySelector('.flip-inner');
          var back = card.querySelector('.flip-back');
          if (inner && back) inner.style.height = back.offsetHeight + 'px';
        });
      });
    })();
  </script>
</body>
</html>
