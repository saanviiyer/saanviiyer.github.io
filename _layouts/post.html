---
layout: default
---
<div class="wm-shell{% if page.section != 'technical' %} wm-notoc{% endif %}">
  <aside class="wm-toc" aria-label="On this page">
    <p class="wm-toc-label">on this page</p>
    <div id="wmTocNav"></div>
  </aside>

  <article class="research-post">
    <header class="rp-head">
      <p class="rp-eyebrow"><a href="{{ '/writing/' | relative_url }}">&larr; writing</a>{% if page.tag %}, {{ page.tag }}{% endif %}, {{ page.date | date: "%b %-d, %Y" }}</p>
      <h1 class="rp-title">{{ page.title }}</h1>
      {% if page.dek %}<p class="rp-dek">{{ page.dek }}</p>{% endif %}
      {% if page.image %}
      <figure class="rp-hero">
        <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">
        {% if page.image_caption %}<figcaption>{{ page.image_caption }}</figcaption>{% endif %}
      </figure>
      {% endif %}
    </header>

    <div class="rp-body">
      {{ content }}
    </div>

    <p class="post-back"><a href="{{ '/writing/' | relative_url }}">&larr; all writing</a></p>
  </article>
</div>

<script>
/* Build the "on this page" table of contents from the post's h2 headings,
   and highlight the current section while scrolling. The post reads normally
   if this never runs: the TOC is purely additive. */
(function () {
  var body = document.querySelector('.research-post .rp-body');
  var nav = document.getElementById('wmTocNav');
  if (!body || !nav) return;
  var heads = body.querySelectorAll(':scope > h2');
  if (heads.length < 2) {
    var aside = document.querySelector('.wm-toc');
    if (aside) aside.style.display = 'none';
    var shell = document.querySelector('.wm-shell');
    if (shell) shell.classList.add('wm-notoc');
    return;
  }
  var links = [];
  heads.forEach(function (h, i) {
    if (!h.id) {
      h.id = 'sec-' + (i + 1) + '-' + (h.textContent || '').toLowerCase()
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
    }
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    nav.appendChild(a);
    links.push(a);
  });
  if (!('IntersectionObserver' in window)) return;
  var byId = {};
  links.forEach(function (a) { byId[a.getAttribute('href').slice(1)] = a; });
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      links.forEach(function (a) { a.classList.remove('active'); });
      var a = byId[e.target.id];
      if (a) a.classList.add('active');
    });
  }, { rootMargin: '0px 0px -75% 0px', threshold: 0 });
  heads.forEach(function (h) { io.observe(h); });
})();
</script>


<script>
/* Additive scroll reveals for research posts.

   Content is visible without this script: nothing here un-hides anything, it
   only replays a short fade-and-lift as blocks come into view. If
   IntersectionObserver is missing, the user prefers reduced motion, or the
   script simply never runs, the post reads normally. */
(function () {
  var root = document.querySelector('.research-post .rp-body');
  if (!root) return;
  if (!('IntersectionObserver' in window)) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var blocks = root.querySelectorAll(
    ':scope > h2, :scope > p, :scope > ul, :scope > ol, :scope > blockquote, :scope > table');
  if (!blocks.length) return;

  var io = new IntersectionObserver(function (entries) {
    var n = 0;
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      var el = e.target;
      if (el.tagName === 'H2') el.classList.add('rp-h2');
      el.style.animationDelay = (Math.min(n++, 3) * 60) + 'ms';
      el.classList.add('rp-reveal');
      io.unobserve(el);
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });

  blocks.forEach(function (el) { io.observe(el); });
})();
</script>

{% if page.math %}
<script>
  window.MathJax = { tex: {
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    inlineMath: [['\\(', '\\)'], ['$', '$']],
    processEscapes: true,
    macros: {
      bm: ['\\boldsymbol{#1}', 1],
      argmin: '\\operatorname*{arg\\,min}',
      argmax: '\\operatorname*{arg\\,max}',
      E: '\\mathbb{E}',
      Var: '\\operatorname{Var}',
      Cov: '\\operatorname{Cov}',
      tr: '\\operatorname{tr}',
      diag: '\\operatorname{diag}'
    }
  } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
{% endif %}
