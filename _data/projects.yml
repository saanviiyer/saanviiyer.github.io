  tags: "Protein Design · AI/ML"
  status: "Early-stage research."
  link: ""
  cats: ["ai", "compbio"]
  bullets:
    - "Studying when learned fitness proxies stop being reliable among the top protein variants an optimizer selects, and how to constrain directed evolution to the region where a surrogate still holds."
    - "On complete design landscapes, model-driven directed evolution shows no measurable uplift over classical methods at any tested budget, which constrains threat models in both directions."

