<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace }}" />
  <title>{{ page.title | default: site.title }}</title>

  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace }}" />
  {% unless page.layout == 'post' %}<meta property="og:image" content="{{ '/assets/img/og.png' | absolute_url }}" />{% endunless %}
  <meta name="twitter:card" content="{% if page.layout == 'post' %}summary{% else %}summary_large_image{% endif %}" />
  <meta name="twitter:title" content="{{ page.title | default: site.title }}" />
  <meta name="twitter:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace }}" />
  {% unless page.layout == 'post' %}<meta name="twitter:image" content="{{ '/assets/img/og.png' | absolute_url }}" />{% endunless %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />

  <script>
    // Set theme before paint to avoid a flash.
    (function () {
      try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    })();
  </script>
</head>
<body>

  <canvas id="neural-bg" aria-hidden="true"></canvas>
  <div class="spotlight" id="spotlight" aria-hidden="true"></div>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>

  {% unless page.hide_nav %}{% include nav.html %}{% endunless %}

  <main>
    <div class="page-content{% if page.hide_nav %} page-content-home{% endif %}">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}
  <script src="{{ '/assets/js/neural.js' | relative_url }}"></script>
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        window.dispatchEvent(new Event('themechange'));
      });
    })();
  </script>
  <script>
    // Cursor spotlight: a soft flashlight that follows the pointer.
    (function () {
      var el = document.getElementById('spotlight');
      if (!el || window.matchMedia('(hover: none)').matches) return;
      var raf = null, x = 0, y = 0;
      function paint() {
        el.style.setProperty('--mx', x + 'px');
        el.style.setProperty('--my', y + 'px');
        raf = null;
      }
      window.addEventListener('mousemove', function (e) {
        x = e.clientX; y = e.clientY;
        el.classList.add('on');
        if (!raf) raf = requestAnimationFrame(paint);
      });
      document.addEventListener('mouseleave', function () { el.classList.remove('on'); });
    })();
  </script>
</body>
</html>
