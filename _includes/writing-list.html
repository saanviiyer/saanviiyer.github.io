<div class="entry-list">
  {% for item in site.data.writings %}
  <div class="entry-card">
    <div class="entry-year">{{ item.date }}</div>
    <div class="entry-body">
      <div class="entry-top">
        <h3>{{ item.title }}</h3>
      </div>
      <p class="entry-org">
        {{ item.venue }}{% if item.status and item.status != "" %} &middot; {{ item.status }}{% endif %}
      </p>
      {% if item.blurb %}<p class="entry-blurb">{{ item.blurb }}</p>{% endif %}
      <a class="entry-link" href="{{ '/assets/pdfs/' | relative_url }}{{ item.file }}" target="_blank" rel="noopener">pdf &#8599;</a>
    </div>
  </div>
  {% endfor %}
</div>
