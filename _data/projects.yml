- title: "plimsoll"
  featured: true
  theme: "safety"
  tags: "Python · LLM Systems · Research Tooling"
  status: "Public release, MIT licensed. CI green on Python 3.11–3.13."
  link: "https://github.com/saanviiyer/plimsoll"
  cats: ["ai", "eng"]
  bullets:
    - "A command-line auditor that holds a research repository against twenty-two methodology gates — trivial baselines, verified nulls, decisive controls, named confounds, printed denominators — and reports where it first fails them, with the quoted evidence each verdict rests on."
    - "Three tiers: a static check that needs no API key, a Claude-backed adjudicator that runs one prompt-cached call per gate, and an evaluation harness that scores the auditor against instances built to the same standard it audits for."
    - "Separates \"does not apply\" from \"fails\" as distinct verdict states, so an inapplicable gate is never scored as a miss, and turns its own gates on itself — CI re-runs the tool under two interpreter hash seeds and fails the build if the output differs."

